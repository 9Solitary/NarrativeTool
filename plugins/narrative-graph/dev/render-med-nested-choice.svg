<svg xmlns="http://www.w3.org/2000/svg" viewBox="-220 -300 1580 970" width="1580" height="970">
<rect x="-220" y="-300" width="1580" height="970" fill="#0d1117"/>
<path d="M 340 115 C 380 115, 280 145, 320 145" fill="none" stroke="#6e7681" stroke-width="2"/>
<path d="M 580 145 C 620 145, 520 75, 560 75" fill="none" stroke="#6e7681" stroke-width="2"/>
<text x="570" y="104" text-anchor="middle" fill="#c9d1d9" font-size="13">Pay the toll</text>
<path d="M 580 145 C 690 145, 690 325, 800 325" fill="none" stroke="#6e7681" stroke-width="2"/>
<text x="690" y="229" text-anchor="middle" fill="#c9d1d9" font-size="13">Walk away</text>
<path d="M 820 75 C 860 75, 760 55, 800 55" fill="none" stroke="#6e7681" stroke-width="2"/>
<text x="810" y="59" text-anchor="middle" fill="#c9d1d9" font-size="13">Yes</text>
<path d="M 820 75 C 875 75, 745 185, 800 185" fill="none" stroke="#6e7681" stroke-width="2"/>
<text x="810" y="124" text-anchor="middle" fill="#c9d1d9" font-size="13">No</text>
<rect x="80" y="80" width="260" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
<text x="90" y="102" fill="#3fb950" font-size="14" font-weight="bold">Entry · Start</text>
<rect x="320" y="80" width="260" height="130" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
<text x="330" y="102" fill="#d29922" font-size="14" font-weight="bold">Choice · Merchant</text>
<text x="330" y="124" fill="#c9d1d9" font-size="12">• Pay the toll  • Walk away</text>
<rect x="560" y="20" width="260" height="110" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
<text x="570" y="42" fill="#d29922" font-size="14" font-weight="bold">Choice · Merchant</text>
<text x="570" y="64" fill="#c9d1d9" font-size="12">• Yes  • No</text>
<rect x="800" y="0" width="260" height="110" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
<text x="810" y="22" fill="#8b949e" font-size="14" font-weight="bold">Content · Paid</text>
<text x="810" y="44" fill="#c9d1d9" font-size="12">The merchant smiles and hands you the key.</text>
<rect x="800" y="140" width="260" height="90" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
<text x="810" y="162" fill="#8b949e" font-size="14" font-weight="bold">Content · Refused</text>
<text x="810" y="184" fill="#c9d1d9" font-size="12">The merchant frowns and turns away.</text>
<rect x="800" y="280" width="260" height="90" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
<text x="810" y="302" fill="#8b949e" font-size="14" font-weight="bold">Content · Leave</text>
<text x="810" y="324" fill="#c9d1d9" font-size="12">You walk away empty-handed.</text>
